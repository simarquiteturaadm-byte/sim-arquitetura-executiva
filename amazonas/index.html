<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Edifício Amazonas · SIM Arquitetura</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0906;--gold:#c9a96e;--white:#f0ede6;--muted:#8a8478;--line:rgba(201,169,110,0.25)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg)}
body{display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 1.5rem env(safe-area-inset-bottom,0px);font-family:'Montserrat',system-ui,sans-serif;color:var(--white);
background:radial-gradient(ellipse at 50% 35%,rgba(201,169,110,0.08),transparent 60%),var(--bg)}
.box{width:100%;max-width:380px;text-align:center;animation:in 1s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eb{font-weight:200;font-size:8px;letter-spacing:0.45em;color:var(--muted);text-transform:uppercase}
.rule{width:40px;height:0.5px;background:var(--gold);margin:1.6rem auto}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:clamp(2.3rem,9vw,3.2rem);letter-spacing:0.12em;line-height:1.05;text-transform:uppercase}
h1 em{display:block;color:var(--gold);font-style:italic}
.sub{margin-top:1rem;font-weight:200;font-size:8px;letter-spacing:0.35em;color:var(--muted);text-transform:uppercase}
form{margin-top:2.6rem;display:flex;flex-direction:column;gap:0.9rem}
input{width:100%;background:transparent;border:0;border-bottom:0.5px solid var(--line);color:var(--white);font-family:inherit;font-weight:300;font-size:16px;letter-spacing:0.3em;text-align:center;padding:0.8rem 0;outline:none;transition:border-color .3s}
input:focus{border-color:var(--gold)}
input::placeholder{color:var(--muted);letter-spacing:0.35em;font-size:9px;text-transform:uppercase}
.pwf{position:relative}
.pwf input{padding-left:2.6rem;padding-right:2.6rem}
.eye{position:absolute;right:0;top:50%;transform:translateY(-50%);margin:0!important;width:2.4rem;height:2.4rem;padding:0!important;border:0!important;background:transparent!important;display:flex;align-items:center;justify-content:center;cursor:pointer}
.eye svg{width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:1.4;transition:stroke .3s}
.eye:hover svg,.eye.on svg{stroke:var(--gold)}
#bt{margin-top:0.6rem;background:transparent;border:0.5px solid var(--gold);color:var(--gold);font-family:inherit;font-weight:300;font-size:9px;letter-spacing:0.45em;text-transform:uppercase;padding:1rem;cursor:pointer;transition:background .3s,color .3s}
#bt:hover{background:var(--gold);color:var(--bg)}
#bt:disabled{opacity:.5;cursor:wait}
.err{min-height:1.2em;font-weight:300;font-size:9px;letter-spacing:0.25em;color:#d48a7a;text-transform:uppercase}
.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.foot{margin-top:3rem;font-weight:200;font-size:7px;letter-spacing:0.35em;color:var(--muted);text-transform:uppercase}
</style></head><body>
<div class="box" id="box">
  <div class="eb">SIM Arquitetura Executiva</div>
  <div class="rule"></div>
  <h1>Edifício <em>Amazonas</em></h1>
  <div class="sub">Apresentação de Projeto · 2026</div>
  <form id="f" autocomplete="off">
    <div class="pwf"><input id="pw" type="password" placeholder="Digite a senha" autofocus aria-label="Senha" autocapitalize="none" autocorrect="off" spellcheck="false">
    <button type="button" class="eye" id="eye" aria-label="Mostrar senha" title="Mostrar senha"><svg viewBox="0 0 24 24" id="eyeic"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <div class="err" id="err"></div>
    <button id="bt" type="submit">Entrar</button>
  </form>
  <noscript><div class="err" style="margin-top:1.5rem;line-height:2">Este visualizador não executa o site.<br>Abra o arquivo no navegador<br>(Chrome ou Safari).</div></noscript>
  <div class="foot">Acesso restrito</div>
</div>

async function unlock(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(SALT),iterations:IT,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(IV)},key,u8(DATA));
  return new TextDecoder().decode(pt);
}

    if(ex&&ex.name==='OperationError'){err.textContent='Senha incorreta';inp.value='';
      const b=document.getElementById('box');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');inp.focus();}
    else{err.innerHTML='Não foi possível abrir aqui.<br>Abra no navegador (Chrome ou Safari).';}
    return;}
  try{sessionStorage.setItem('amz_pw',inp.value.trim())}catch(_){}
  show(h);
});
(async()=>{let s=null;try{s=sessionStorage.getItem('amz_pw')}catch(_){}
  if(s){try{show(await unlock(s))}catch(_){try{sessionStorage.removeItem('amz_pw')}catch(__){}}}})();
</script></body></html>
