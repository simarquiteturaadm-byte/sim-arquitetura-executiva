<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edifício Amazonas · Acesso</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0906;color:#f0ede6;font-family:Arial,sans-serif}.box{width:min(390px,88vw);text-align:center}.brand{font-size:11px;letter-spacing:.45em;color:#8a8478}.line{width:42px;height:1px;background:#c9a96e;margin:28px auto}h1{font-family:Georgia,serif;font-weight:400;font-size:46px;letter-spacing:.1em;margin:0;text-transform:uppercase}h1 span{display:block;color:#c9a96e;font-style:italic}.sub,.foot{color:#8a8478;letter-spacing:.3em;text-transform:uppercase;font-size:9px;margin-top:18px}input{margin-top:42px;width:100%;background:transparent;border:0;border-bottom:1px solid #5b4b31;color:white;padding:14px;text-align:center;font-size:16px;outline:none}button{width:100%;margin-top:20px;padding:16px;background:transparent;border:1px solid #c9a96e;color:#c9a96e;letter-spacing:.4em;text-transform:uppercase;cursor:pointer}.err{height:22px;color:#d48a7a;font-size:10px;margin-top:10px}</style></head><body><div class="box"><div class="brand">SIM ARQUITETURA EXECUTIVA</div><div class="line"></div><h1>Edifício <span>Amazonas</span></h1><div class="sub">Apresentação de Projeto · 2026</div><form id="f"><input id="p" type="password" placeholder="DIGITE A SENHA" autocomplete="off"><div class="err" id="e"></div><button>Entrar</button></form><div class="foot">Acesso restrito</div></div><script>document.getElementById('f').onsubmit=function(e){e.preventDefault();if(document.getElementById('p').value==='sim-amazonas'){sessionStorage.setItem('amazonas_ok','1');location.href='apresentacao.html'}else document.getElementById('e').textContent='Senha incorreta'};</script></body></html>
