<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edifício Amazonas · SIM Arquitetura</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet"><style>:root{--bg:#0a0906;--gold:#c9a96e;--white:#f0ede6;--muted:#8a8478;--line:rgba(201,169,110,.25)}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;background:var(--bg)}body{display:flex;align-items:center;justify-content:center;padding:1.5rem;font-family:Montserrat,system-ui,sans-serif;color:var(--white);background:radial-gradient(ellipse at 50% 35%,rgba(201,169,110,.08),transparent 60%),var(--bg)}.box{width:100%;max-width:420px;text-align:center}.eb{font-weight:200;font-size:8px;letter-spacing:.45em;color:var(--muted);text-transform:uppercase}.rule{width:40px;height:.5px;background:var(--gold);margin:1.6rem auto}h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:clamp(2.3rem,9vw,3.2rem);letter-spacing:.12em;line-height:1.05;text-transform:uppercase}h1 em{display:block;color:var(--gold);font-style:italic}.sub{margin-top:1rem;font-weight:200;font-size:8px;letter-spacing:.35em;color:var(--muted);text-transform:uppercase}form{margin-top:2.6rem;display:flex;flex-direction:column;gap:.9rem}.pwf{position:relative}input{width:100%;background:transparent;border:0;border-bottom:.5px solid var(--line);color:var(--white);font-family:inherit;font-weight:300;font-size:16px;letter-spacing:.3em;text-align:center;padding:.8rem 2.6rem;outline:none}input:focus{border-color:var(--gold)}input::placeholder{color:var(--muted);letter-spacing:.35em;font-size:9px;text-transform:uppercase}.eye{position:absolute;right:0;top:50%;transform:translateY(-50%);width:2.4rem;height:2.4rem;border:0;background:transparent;color:var(--gold);cursor:pointer;font-size:18px}button[type=submit]{margin-top:.6rem;background:transparent;border:.5px solid var(--gold);color:var(--gold);font-family:inherit;font-weight:300;font-size:9px;letter-spacing:.45em;text-transform:uppercase;padding:1rem;cursor:pointer}.err{min-height:1.2em;font-size:9px;letter-spacing:.25em;color:#d48a7a;text-transform:uppercase}.foot{margin-top:3rem;font-size:7px;letter-spacing:.35em;color:var(--muted);text-transform:uppercase}</style></head><body><div class="box"><div class="eb">SIM Arquitetura Executiva</div><div class="rule"></div><h1>Edifício <em>Amazonas</em></h1><div class="sub">Apresentação de Projeto · 2026</div><form id="f"><div class="pwf"><input id="pw" type="password" placeholder="Digite a senha" autofocus><button type="button" class="eye" id="eye">◉</button></div><div class="err" id="err"></div><button type="submit">Entrar</button></form><div class="foot">Acesso restrito</div></div><script>const p=document.getElementById('pw');document.getElementById('eye').onclick=()=>p.type=p.type==='password'?'text':'password';document.getElementById('f').onsubmit=e=>{e.preventDefault();if(p.value.trim()==='sim-amazonas'){sessionStorage.setItem('amz_ok','1');location.href='./apresentacao.html'}else{document.getElementById('err').textContent='Senha incorreta';p.value='';p.focus()}};</script></body></html>
